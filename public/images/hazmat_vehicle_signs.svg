<svg xmlns="http://www.w3.org/2000/svg" width="760" height="744" viewBox="0 0 760 744" role="img" aria-labelledby="title desc">
  <title id="title">위험물 수송차량의 표지와 UN번호</title>
  <desc id="desc">차량 위험물 표지는 검정 바탕에 노란 반사글씨이며 가로 60센티미터 이상, 세로 30센티미터 이상입니다. 그림문자 바깥 UN번호는 오렌지 바탕 검정 글씨, 30 곱하기 12센티미터 이상입니다. 안쪽 UN번호는 흰 바탕 검정 글씨이며 심벌과 분류번호를 가리지 않습니다. 그림의 1203은 휘발유의 예입니다.</desc>
  <defs>
    <marker id="dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M9 5L1 1V9Z" fill="#526b80"/></marker>
    <path id="flame" d="M0 33C-26 18-19-1-10-15C-10-5-6-2-4-1C4-12 4-23 0-34C22-17 20-3 17 4C24 0 26-6 25-11C40 13 23 36 0 33Z"/>
  </defs>
  <rect width="760" height="744" rx="18" fill="#eff4f9"/>
  <g font-family="Malgun Gothic, system-ui, sans-serif" fill="#193450">
    <text x="24" y="36" font-size="24" font-weight="700">차량의 위험물 표지</text>
    <rect x="24" y="54" width="320" height="160" fill="#000"/>
    <text x="184" y="155" text-anchor="middle" font-size="66" font-weight="800" fill="#ffdf00">위험물</text>
    <g fill="none" stroke="#526b80" stroke-width="1.5" marker-start="url(#dim)" marker-end="url(#dim)">
      <path d="M24 235H344"/>
      <path d="M363 54V214"/>
    </g>
    <text x="184" y="262" text-anchor="middle" font-size="20">60 cm 이상</text>
    <text x="376" y="130" font-size="19">30 cm</text>
    <text x="376" y="156" font-size="19">이상</text>
    <text x="470" y="76" font-size="21" font-weight="700">흑색 바탕</text>
    <text x="470" y="105" font-size="21" font-weight="700">황색 반사글씨</text>
    <text x="470" y="151" font-size="19">이동탱크저장소</text>
    <text x="470" y="177" font-size="19">전면 상단·후면 상단</text>
    <text x="470" y="214" font-size="19">위험물 운반차량</text>
    <text x="470" y="240" font-size="19">전면·후면</text>
    <text x="24" y="309" font-size="24" font-weight="700">UN번호 표시의 두 방법</text>
    <text x="24" y="339" font-size="19" fill="#435f77">번호 1203은 휘발유의 예 · 후면과 양 측면에 표시</text>
    <rect x="24" y="363" width="340" height="275" rx="12" fill="#fff" stroke="#d4e2ef"/>
    <text x="194" y="395" text-anchor="middle" font-size="21" font-weight="700">그림문자 바깥에 표시</text>
    <rect x="59" y="423" width="270" height="108" fill="#ff8200" stroke="#000" stroke-width="9"/>
    <text x="194" y="501" text-anchor="middle" font-size="72" font-weight="700" fill="#000">1203</text>
    <text x="194" y="566" text-anchor="middle" font-size="20">30 × 12 cm 이상</text>
    <text x="194" y="594" text-anchor="middle" font-size="18">검정 테두리 두께 1 cm</text>
    <text x="194" y="620" text-anchor="middle" font-size="18">그림문자 바로 옆에 부착</text>
    <rect x="384" y="363" width="352" height="275" rx="12" fill="#fff" stroke="#d4e2ef"/>
    <text x="560" y="395" text-anchor="middle" font-size="21" font-weight="700">그림문자 안에 표시</text>
    <g>
      <path d="M560 414L656 510L560 606L464 510Z" fill="#c8102e" stroke="#000" stroke-width="2"/>
      <use href="#flame" transform="translate(560 464) scale(.65)" fill="#fff"/>
      <rect x="493" y="495" width="134" height="43" fill="#fff"/>
      <text x="560" y="529" text-anchor="middle" font-size="40" font-weight="700" fill="#000">1203</text>
      <text x="560" y="582" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">3</text>
    </g>
    <text x="560" y="625" text-anchor="middle" font-size="18">흰 바탕·검정 번호</text>
    <text x="24" y="681" font-size="20" font-weight="700">두 방식 모두 UN번호 글자 높이는 6.5 cm 이상</text>
    <text x="24" y="713" font-size="19" fill="#435f77">안쪽 번호는 심벌과 하단 분류번호를 가리지 않는 크기로 표시</text>
  </g>
</svg>
