<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="100%" height="100%">
  <rect width="780" height="380" fill="#ffffff" rx="12" />
  
  <!-- Main Title -->
  <text x="390" y="32" font-family="'Pretendard', sans-serif" font-size="20" font-weight="800" fill="#0f172a" text-anchor="middle">회귀 잔차 &amp; 통계 검정의 등분산성(Homoscedasticity) 진단 및 대책</text>

  <!-- Left Card: Homoscedasticity (Good) -->
  <g transform="translate(20, 52)">
    <rect width="360" height="305" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" rx="10" />
    <text x="180" y="26" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" fill="#166534" text-anchor="middle">1. 등분산성 만족 (Homoscedasticity)</text>
    
    <!-- Graph Canvas -->
    <rect x="15" y="40" width="330" height="170" fill="#ffffff" stroke="#dcfce7" stroke-width="1" rx="6" />

    <!-- Axes -->
    <line x1="35" y1="125" x2="330" y2="125" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" />
    <line x1="40" y1="185" x2="40" y2="55" stroke="#94a3b8" stroke-width="1.5" />
    <text x="330" y="140" font-family="'Pretendard', sans-serif" font-size="10" font-weight="700" fill="#64748b" text-anchor="end">예측값 (Ŷ)</text>
    <text x="35" y="50" font-family="'Pretendard', sans-serif" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">잔차 e</text>

    <!-- Constant Band Lines -->
    <line x1="45" y1="80" x2="320" y2="80" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,2" />
    <line x1="45" y1="170" x2="320" y2="170" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,2" />

    <!-- Uniformly Distributed Scatter Points -->
    <circle cx="60" cy="115" r="4" fill="#15803d" />
    <circle cx="80" cy="90" r="4" fill="#15803d" />
    <circle cx="100" cy="150" r="4" fill="#15803d" />
    <circle cx="130" cy="100" r="4" fill="#15803d" />
    <circle cx="160" cy="140" r="4" fill="#15803d" />
    <circle cx="190" cy="85" r="4" fill="#15803d" />
    <circle cx="220" cy="160" r="4" fill="#15803d" />
    <circle cx="250" cy="110" r="4" fill="#15803d" />
    <circle cx="280" cy="135" r="4" fill="#15803d" />
    <circle cx="305" cy="95" r="4" fill="#15803d" />

    <!-- Description -->
    <rect x="15" y="220" width="330" height="72" fill="#ffffff" stroke="#bbf7d0" stroke-width="1" rx="6" />
    <text x="25" y="240" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#166534">• 특성: 예측값 구간 전체에서 잔차 분산 일정</text>
    <text x="25" y="260" font-family="'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#334155">• 회귀 5대 기본 가정 족쇄 충족 (선독등비정)</text>
    <text x="25" y="278" font-family="'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#15803d">• t-검정/ANOVA 등 집단 비교 시 기본 전제</text>
  </g>

  <!-- Right Card: Heteroscedasticity (Violation & Issue) -->
  <g transform="translate(400, 52)">
    <rect width="360" height="305" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" rx="10" />
    <text x="180" y="26" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" fill="#991b1b" text-anchor="middle">2. 이분산성 발생 (Heteroscedasticity)</text>

    <!-- Graph Canvas -->
    <rect x="15" y="40" width="330" height="170" fill="#ffffff" stroke="#fee2e2" stroke-width="1" rx="6" />

    <!-- Axes -->
    <line x1="35" y1="125" x2="330" y2="125" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" />
    <line x1="40" y1="185" x2="40" y2="55" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Funnel / Fan Shape Lines -->
    <line x1="50" y1="120" x2="315" y2="60" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,2" />
    <line x1="50" y1="130" x2="315" y2="190" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,2" />

    <!-- Funnel Scatter Points -->
    <circle cx="60" cy="122" r="4" fill="#dc2626" />
    <circle cx="90" cy="118" r="4" fill="#dc2626" />
    <circle cx="120" cy="133" r="4" fill="#dc2626" />
    <circle cx="150" cy="108" r="4" fill="#dc2626" />
    <circle cx="180" cy="148" r="4" fill="#dc2626" />
    <circle cx="210" cy="90" r="4" fill="#dc2626" />
    <circle cx="240" cy="165" r="4" fill="#dc2626" />
    <circle cx="270" cy="75" r="4" fill="#dc2626" />
    <circle cx="300" cy="180" r="4" fill="#dc2626" />

    <text x="260" y="115" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#b91c1c">부채꼴 퍼짐 현상</text>

    <!-- Diagnostic Tests & Remedies -->
    <rect x="15" y="220" width="330" height="72" fill="#ffffff" stroke="#fecaca" stroke-width="1" rx="6" />
    <text x="25" y="238" font-family="'Pretendard', sans-serif" font-size="11" font-weight="800" fill="#991b1b">• 진단 검정: Levene 검정(르빈), Bartlett 검정</text>
    <text x="25" y="256" font-family="'Pretendard', sans-serif" font-size="11" font-weight="700" fill="#b91c1c">• 해결 대책: 종속변수 로그변환 (log Y)</text>
    <text x="25" y="274" font-family="'Pretendard', sans-serif" font-size="11" font-weight="700" fill="#475569">• 모델 변환: 가중회귀(WLS) / Welch's t-test</text>
  </g>
</svg>
