<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="100%" height="100%">
  <rect width="780" height="360" fill="#ffffff" rx="12" />
  
  <!-- Title Header -->
  <text x="390" y="32" font-family="'Pretendard', sans-serif" font-size="20" font-weight="800" fill="#0f172a" text-anchor="middle">과소적합(Underfitting) vs 과대적합(Overfitting) &amp; 편향-분산 상충</text>

  <!-- Left Box: Underfitting vs Optimal vs Overfitting Curves -->
  <g transform="translate(20, 55)">
    <rect width="360" height="280" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="10" />
    <text x="180" y="28" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" fill="#1e293b" text-anchor="middle">1. 모델 복잡도에 따른 적합 형태</text>
    
    <!-- Mini Graph 1: Underfitting -->
    <g transform="translate(15, 45)">
      <rect width="100" height="100" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="6" />
      <text x="50" y="18" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#dc2626" text-anchor="middle">과소적합</text>
      <!-- Straight simple line -->
      <path d="M 15 80 L 85 35" stroke="#ef4444" stroke-width="2.5" fill="none" />
      <circle cx="20" cy="70" r="3" fill="#3b82f6" />
      <circle cx="40" cy="35" r="3" fill="#3b82f6" />
      <circle cx="60" cy="75" r="3" fill="#3b82f6" />
      <circle cx="80" cy="40" r="3" fill="#3b82f6" />
      <text x="50" y="93" font-family="'Pretendard', sans-serif" font-size="10" font-weight="700" fill="#b91c1c" text-anchor="middle">높은 편향 (High Bias)</text>
    </g>

    <!-- Mini Graph 2: Optimal Fit -->
    <g transform="translate(130, 45)">
      <rect width="100" height="100" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" rx="6" />
      <text x="50" y="18" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#166534" text-anchor="middle">최적 적합 (Good)</text>
      <!-- Smooth curve -->
      <path d="M 15 75 Q 45 25 85 70" stroke="#16a34a" stroke-width="2.5" fill="none" />
      <circle cx="20" cy="70" r="3" fill="#3b82f6" />
      <circle cx="45" cy="30" r="3" fill="#3b82f6" />
      <circle cx="70" cy="50" r="3" fill="#3b82f6" />
      <circle cx="85" cy="72" r="3" fill="#3b82f6" />
      <text x="50" y="93" font-family="'Pretendard', sans-serif" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">일반화 성능 우수</text>
    </g>

    <!-- Mini Graph 3: Overfitting -->
    <g transform="translate(245, 45)">
      <rect width="100" height="100" fill="#ffffff" stroke="#fecaca" stroke-width="1.5" rx="6" />
      <text x="50" y="18" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">과대적합</text>
      <!-- Jagged wiggly line connecting all dots -->
      <path d="M 15 75 L 20 70 L 30 85 L 45 30 L 60 70 L 70 50 L 85 72" stroke="#dc2626" stroke-width="2" fill="none" />
      <circle cx="20" cy="70" r="3" fill="#3b82f6" />
      <circle cx="45" cy="30" r="3" fill="#3b82f6" />
      <circle cx="70" cy="50" r="3" fill="#3b82f6" />
      <circle cx="85" cy="72" r="3" fill="#3b82f6" />
      <text x="50" y="93" font-family="'Pretendard', sans-serif" font-size="10" font-weight="700" fill="#b91c1c" text-anchor="middle">높은 분산 (Variance)</text>
    </g>

    <!-- Comparison Summary -->
    <rect x="15" y="160" width="330" height="105" fill="#ffffff" stroke="#e2e8f0" fill-opacity="0.9" rx="6" />
    <text x="25" y="182" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#991b1b">• 과대적합(Overfitting): 훈련 오차 ↓ / 검증 오차 ↑</text>
    <text x="35" y="200" font-family="'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#475569">해결: 규제(L1/L2), 데이터증가, 가지치기, Dropout, CV</text>
    <text x="25" y="222" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#92400e">• 과소적합(Underfitting): 훈련 오차 ↑ / 검증 오차 ↑</text>
    <text x="35" y="240" font-family="'Pretendard', sans-serif" font-size="11" font-weight="600" fill="#475569">해결: 피처 추가, 모델 복잡도 상승, 규제 완화</text>
  </g>

  <!-- Right Box: Bias-Variance Tradeoff Graph -->
  <g transform="translate(400, 55)">
    <rect width="360" height="280" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="10" />
    <text x="180" y="28" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" fill="#1e293b" text-anchor="middle">2. 편향-분산 트레이드오프 (Bias-Variance)</text>

    <!-- Graph Canvas -->
    <rect x="20" y="42" width="320" height="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6" />
    
    <!-- Axes -->
    <line x1="45" y1="230" x2="320" y2="230" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="45" y1="230" x2="45" y2="55" stroke="#94a3b8" stroke-width="1.5" />
    <text x="320" y="247" font-family="'Pretendard', sans-serif" font-size="10" font-weight="700" fill="#64748b" text-anchor="end">모델 복잡도 ➔</text>
    <text x="40" y="50" font-family="'Pretendard', sans-serif" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">오차 (Error)</text>

    <!-- Bias² Curve (Decreasing) -->
    <path d="M 55 70 C 100 160, 200 200, 310 205" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,2" />
    <text x="95" y="115" font-family="'Pretendard', sans-serif" font-size="11" font-weight="700" fill="#2563eb">편향 (Bias²)</text>

    <!-- Variance Curve (Increasing) -->
    <path d="M 55 210 C 160 205, 240 160, 310 65" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,2" />
    <text x="270" y="115" font-family="'Pretendard', sans-serif" font-size="11" font-weight="700" fill="#dc2626">분산 (Variance)</text>

    <!-- Total Error Curve (U-shaped) -->
    <path d="M 55 120 Q 180 250 310 90" fill="none" stroke="#16a34a" stroke-width="3" />
    <text x="180" y="130" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#15803d" text-anchor="middle">전체 오차 (Total Error)</text>

    <!-- Optimal Point Line -->
    <line x1="180" y1="55" x2="180" y2="230" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3,3" />
    <circle cx="180" cy="184" r="5" fill="#f59e0b" />
    <text x="180" y="247" font-family="'Pretendard', sans-serif" font-size="11" font-weight="800" fill="#d97706" text-anchor="middle">★ 최적 복잡도</text>
  </g>
</svg>
