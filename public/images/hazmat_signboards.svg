<svg xmlns="http://www.w3.org/2000/svg" width="760" height="850" viewBox="0 0 760 850" role="img" aria-labelledby="title desc">
  <title id="title">위험물 시설 표지와 게시판의 규격·색상</title>
  <desc id="desc">시설 표지와 게시판은 보기 쉬운 곳에 설치합니다. 위험물 제조소, 위험물 옥내저장소, 위험물 옥외저장소 표지는 백색 바탕에 흑색 문자입니다. 방화 게시판도 백색 바탕에 흑색 문자이며 유별, 품명, 최대수량, 지정수량의 배수와 안전관리자의 성명 또는 직명을 적습니다. 시설 표지와 방화 게시판, 물기엄금·화기주의·화기엄금 주의사항 게시판은 한 변 0.6미터 이상, 다른 한 변 0.3미터 이상인 직사각형입니다. 물기엄금은 청색 바탕에 백색 문자이며 화기주의와 화기엄금은 적색 바탕에 백색 문자입니다. 금연 표지는 금연 문구와 위반 시 과태료 부과 문구를 넣은 크기·배색의 예입니다.</desc>
  <defs>
    <marker id="dimension-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#658099"/>
    </marker>
  </defs>
  <rect width="760" height="850" rx="18" fill="#eff4f9"/>
  <g font-family="system-ui, Malgun Gothic, sans-serif">
    <text x="32" y="37" fill="#142b45" font-size="27" font-weight="800">시설을 알리는 표지</text>
    <text x="32" y="65" fill="#435972" font-size="22">보기 쉬운 곳에 설치</text>

    <g fill="#fff" stroke="#111" stroke-width="2">
      <rect x="64" y="83" width="176" height="88"/>
      <rect x="292" y="83" width="176" height="88"/>
      <rect x="520" y="83" width="176" height="88"/>
    </g>
    <g fill="#000" text-anchor="middle" font-size="23" font-weight="800">
      <text x="152" y="120">위험물</text>
      <text x="152" y="153">제조소</text>
      <text x="380" y="120">위험물</text>
      <text x="380" y="153">옥내저장소</text>
      <text x="608" y="120">위험물</text>
      <text x="608" y="153">옥외저장소</text>
    </g>
    <g fill="none" stroke="#658099" stroke-width="2">
      <path d="M64 179v23m176-23v23M56 83H35m21 88H35"/>
      <path d="M67 193h170M44 86v82" marker-start="url(#dimension-arrow)" marker-end="url(#dimension-arrow)"/>
    </g>
    <g fill="#435972" font-size="22" font-weight="700">
      <text x="152" y="225" text-anchor="middle">0.6 m 이상</text>
      <text transform="translate(24 127) rotate(-90)" text-anchor="middle">0.3 m 이상</text>
      <text x="292" y="216">한 변·다른 한 변의 최소 치수</text>
    </g>
    <text x="380" y="256" text-anchor="middle" fill="#435972" font-size="22">아래 방화·주의사항 게시판에도 같은 최소 치수 적용</text>

    <text x="32" y="285" fill="#142b45" font-size="24" font-weight="800">방화 게시판 · 기재 예</text>
    <rect x="64" y="301" width="360" height="180" fill="#fff" stroke="#111" stroke-width="2"/>
    <path d="M204 301v180M64 337h360M64 373h360M64 409h360M64 445h360" fill="none" stroke="#111" stroke-width="1.5"/>
    <g fill="#000" font-size="20">
      <g text-anchor="middle" font-weight="700">
        <text x="134" y="326">유별</text>
        <text x="134" y="362">품명</text>
        <text x="134" y="398">최대수량</text>
        <text x="134" y="434">지정수량 배수</text>
        <text x="134" y="470">안전관리자</text>
      </g>
      <text x="222" y="326">제4류</text>
      <text x="222" y="362">제4석유류</text>
      <text x="222" y="398">12,000 L</text>
      <text x="222" y="434">2배</text>
      <text x="222" y="470">안전관리팀장</text>
    </g>
    <g fill="#435972" font-size="22" font-weight="700">
      <text x="472" y="356">백색 바탕</text>
      <text x="472" y="391">흑색 문자</text>
      <text x="472" y="451" font-size="20">성명 또는 직명 기재</text>
    </g>

    <text x="32" y="519" fill="#142b45" font-size="24" font-weight="800">주의사항 게시판</text>
    <rect x="64" y="540" width="176" height="88" fill="#1456c0"/>
    <rect x="292" y="540" width="176" height="88" fill="#c9252b"/>
    <rect x="520" y="540" width="176" height="88" fill="#c9252b"/>
    <g fill="#fff" text-anchor="middle" font-size="27" font-weight="800">
      <text x="152" y="594">물기엄금</text>
      <text x="380" y="594">화기주의</text>
      <text x="608" y="594">화기엄금</text>
    </g>
    <g fill="#435972" text-anchor="middle" font-size="22">
      <text x="152" y="661">청색 바탕</text>
      <text x="152" y="691">백색 문자</text>
      <text x="380" y="661">적색 바탕</text>
      <text x="380" y="691">백색 문자</text>
      <text x="608" y="661">적색 바탕</text>
      <text x="608" y="691">백색 문자</text>
    </g>

    <text x="32" y="730" fill="#142b45" font-size="24" font-weight="800">금연 표지 · 배색·크기 예</text>
    <rect x="64" y="749" width="632" height="72" rx="6" fill="#fff" stroke="#c9252b" stroke-width="2"/>
    <text x="91" y="795" fill="#c9252b" font-size="30" font-weight="800">금연</text>
    <text x="232" y="793" fill="#000" font-size="24" font-weight="700">위반 시 과태료 부과</text>
  </g>
</svg>
