<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="100%" height="100%">
  <rect width="780" height="380" fill="#ffffff" rx="12" />
  
  <!-- Title Header -->
  <text x="390" y="30" font-family="'Pretendard', -apple-system, sans-serif" font-size="19" font-weight="800" fill="#0f172a" text-anchor="middle">비계층적 군집 분석 알고리즘 (K-Means, DBSCAN) &amp; 평가지표</text>

  <!-- Left Box: K-Means & DBSCAN (with eps & min_samples) -->
  <g transform="translate(20, 48)">
    <rect width="360" height="315" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="10" />
    <text x="180" y="24" font-family="'Pretendard', sans-serif" font-size="14" font-weight="800" fill="#1e293b" text-anchor="middle">1. K-Means vs DBSCAN (밀도 &amp; 파라미터)</text>

    <!-- K-Means Summary Card -->
    <g transform="translate(12, 34)">
      <rect width="336" height="74" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6" />
      <text x="12" y="18" font-family="'Pretendard', sans-serif" font-size="11" font-weight="800" fill="#2563eb">① K-Means (중심점 기반 구형 군집)</text>
      <text x="12" y="34" font-family="'Pretendard', sans-serif" font-size="9" stroke="none" fill="#475569">• 파라미터: <tspan font-weight="800" fill="#1d4ed8">K (군집 수)</tspan> 사전 지정 필수</text>
      <text x="12" y="48" font-family="'Pretendard', sans-serif" font-size="9" fill="#475569">• 구형(Spherical) 형태만 가능, 이상치(Outlier)에 왜곡 발생</text>
      <text x="12" y="62" font-family="'Pretendard', sans-serif" font-size="9" fill="#2563eb" font-weight="700">➔ 거리 기준 중심점(Centroid) 반복 재계산 업데이트</text>
    </g>

    <!-- DBSCAN Detail Card (eps & min_samples focus) -->
    <g transform="translate(12, 116)">
      <rect width="336" height="188" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6" />
      <text x="12" y="20" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#7c3aed">② DBSCAN (밀도 기반 2대 파라미터)</text>
      
      <!-- Parameter Box -->
      <g transform="translate(10, 28)">
        <rect width="152" height="60" fill="#f3e8ff" stroke="#d8b4fe" rx="5" />
        <text x="10" y="18" font-family="'Pretendard', sans-serif" font-size="10" font-weight="800" fill="#6b21a8">1. eps (ε, 반경)</text>
        <text x="10" y="32" font-family="'Pretendard', sans-serif" font-size="8.5" fill="#7e22ce">• 이웃 탐색 반지름 거리</text>
        <text x="10" y="45" font-family="'Pretendard', sans-serif" font-size="8" fill="#6b21a8">• ↑: 군집병합 | ↓: 노이즈증가</text>
      </g>

      <g transform="translate(172, 28)">
        <rect width="154" height="60" fill="#fcf4ff" stroke="#f5d0fe" rx="5" />
        <text x="10" y="18" font-family="'Pretendard', sans-serif" font-size="10" font-weight="800" fill="#a21caf">2. min_samples (minPts)</text>
        <text x="10" y="32" font-family="'Pretendard', sans-serif" font-size="8.5" fill="#86198f">• Core 되기위한 최소 이웃수</text>
        <text x="10" y="45" font-family="'Pretendard', sans-serif" font-size="8" fill="#701a75">• ↑: 노이즈증가 | ↓: 노이즈감소</text>
      </g>

      <!-- Visual Diagram: Core, Border, Noise Points -->
      <g transform="translate(10, 95)">
        <rect width="316" height="82" fill="#faf5ff" stroke="#e9d5ff" rx="5" />
        
        <!-- Core Point with Circle (eps radius) -->
        <circle cx="50" cy="40" r="28" fill="#e9d5ff" opacity="0.5" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3,2" />
        <circle cx="50" cy="40" r="4" fill="#7c3aed" /> <!-- Core -->
        <circle cx="35" cy="28" r="3" fill="#8b5cf6" />
        <circle cx="65" cy="25" r="3" fill="#8b5cf6" />
        <circle cx="60" cy="55" r="3" fill="#8b5cf6" />
        <circle cx="32" cy="50" r="3" fill="#8b5cf6" />
        <!-- eps arrow -->
        <line x1="50" y1="40" x2="78" y2="40" stroke="#7c3aed" stroke-width="1.5" />
        <text x="64" y="36" font-family="'Pretendard', sans-serif" font-size="7" font-weight="800" fill="#6b21a8">eps</text>

        <text x="50" y="74" font-family="'Pretendard', sans-serif" font-size="8.5" font-weight="800" fill="#6b21a8" text-anchor="middle">★ Core Point</text>
        <text x="50" y="81" font-family="'Pretendard', sans-serif" font-size="7" fill="#7e22ce" text-anchor="middle">(이웃 ≥ min_samples)</text>

        <!-- Border Point -->
        <circle cx="160" cy="40" r="4" fill="#ec4899" />
        <line x1="78" y1="40" x2="160" y2="40" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="2,2" />
        <text x="160" y="74" font-family="'Pretendard', sans-serif" font-size="8.5" font-weight="800" fill="#be185d" text-anchor="middle">★ Border Point</text>
        <text x="160" y="81" font-family="'Pretendard', sans-serif" font-size="7" fill="#9d174d" text-anchor="middle">(Core 반경 내 존재)</text>

        <!-- Noise Point -->
        <circle cx="260" cy="40" r="4" fill="#64748b" />
        <path d="M 255 35 L 265 45 M 265 35 L 255 45" stroke="#ef4444" stroke-width="2" />
        <text x="260" y="74" font-family="'Pretendard', sans-serif" font-size="8.5" font-weight="800" fill="#475569" text-anchor="middle">★ Noise Point</text>
        <text x="260" y="81" font-family="'Pretendard', sans-serif" font-size="7" fill="#dc2626" text-anchor="middle">(Core/Border 아님, 이상치)</text>
      </g>
    </g>
  </g>

  <!-- Right Box: Clustering Evaluation Metrics (Elbow & Silhouette) -->
  <g transform="translate(400, 48)">
    <rect width="360" height="315" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="10" />
    <text x="180" y="24" font-family="'Pretendard', sans-serif" font-size="14" font-weight="800" fill="#1e293b" text-anchor="middle">2. 군집 평가지표 (엘보우 &amp; 실루엣 계수)</text>

    <!-- Upper Right: Elbow Method Graph -->
    <g transform="translate(15, 34)">
      <rect width="330" height="126" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="8" />
      <text x="15" y="20" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#0284c7">① 엘보우 기법 (Elbow Method)</text>
      <text x="15" y="33" font-family="'Pretendard', sans-serif" font-size="9" font-weight="600" fill="#64748b">SSE(오차제곱합) 감소 폭이 급격히 완만해지는 굴곡점 = 최적 K</text>

      <!-- Axes -->
      <line x1="45" y1="45" x2="45" y2="108" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="45" y1="108" x2="310" y2="108" stroke="#94a3b8" stroke-width="1.5" />
      <text x="35" y="45" font-family="'Pretendard', sans-serif" font-size="8" font-weight="700" fill="#64748b" text-anchor="end">SSE</text>
      <text x="305" y="120" font-family="'Pretendard', sans-serif" font-size="8" font-weight="700" fill="#64748b">K (군집 수)</text>

      <!-- Grid Ticks K=1..5 -->
      <text x="75" y="118" font-family="'Pretendard', sans-serif" font-size="8" fill="#64748b">K=1</text>
      <text x="130" y="118" font-family="'Pretendard', sans-serif" font-size="8" fill="#64748b">K=2</text>
      <text x="185" y="118" font-family="'Pretendard', sans-serif" font-size="8" fill="#0284c7" font-weight="800">K=3 (Elbow)</text>
      <text x="240" y="118" font-family="'Pretendard', sans-serif" font-size="8" fill="#64748b">K=4</text>
      <text x="290" y="118" font-family="'Pretendard', sans-serif" font-size="8" fill="#64748b">K=5</text>

      <!-- Curve Line -->
      <path d="M 50 50 Q 110 82 185 98 L 240 102 L 290 104" fill="none" stroke="#0284c7" stroke-width="2.5" />
      <circle cx="50" cy="50" r="3" fill="#0284c7" />
      <circle cx="110" cy="80" r="3" fill="#0284c7" />

      <!-- Elbow Point Highlight -->
      <circle cx="185" cy="98" r="6" fill="#ea580c" stroke="#ffffff" stroke-width="1.5" />
      <line x1="185" y1="98" x2="185" y2="108" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="2,2" />
      <rect x="155" y="52" width="90" height="18" fill="#ffedd5" stroke="#fed7aa" rx="3" />
      <text x="200" y="64" font-family="'Pretendard', sans-serif" font-size="9" font-weight="800" fill="#c2410c" text-anchor="middle">★ 최적 K = 3 (Elbow)</text>
    </g>

    <!-- Lower Right: Silhouette Coefficient -->
    <g transform="translate(15, 172)">
      <rect width="330" height="132" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="8" />
      <text x="15" y="20" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#16a34a">② 실루엣 계수 (Silhouette Coefficient)</text>
      
      <!-- Formula Box -->
      <rect x="15" y="28" width="300" height="34" fill="#f0fdf4" stroke="#bbf7d0" rx="5" />
      <text x="165" y="49" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#15803d" text-anchor="middle">s(i) = [ b(i) - a(i) ] / max( a(i), b(i) )</text>

      <!-- Key Concept Breakdown -->
      <g transform="translate(15, 70)">
        <rect width="142" height="48" fill="#eff6ff" stroke="#bfdbfe" rx="4" />
        <text x="10" y="18" font-family="'Pretendard', sans-serif" font-size="10" font-weight="800" fill="#1d4ed8">a(i): 군집 내 평균 거리</text>
        <text x="10" y="34" font-family="'Pretendard', sans-serif" font-size="9" font-weight="600" fill="#2563eb">응집도 (작을수록 우수)</text>
      </g>
      <g transform="translate(173, 70)">
        <rect width="142" height="48" fill="#fdf2f8" stroke="#fbcfe8" rx="4" />
        <text x="10" y="18" font-family="'Pretendard', sans-serif" font-size="10" font-weight="800" fill="#be185d">b(i): 타 군집 평균 거리</text>
        <text x="10" y="34" font-family="'Pretendard', sans-serif" font-size="9" font-weight="600" fill="#db2777">분리도 (클수록 우수)</text>
      </g>
    </g>
  </g>
</svg>
