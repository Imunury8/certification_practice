<svg xmlns="http://www.w3.org/2000/svg" width="720" height="230" viewBox="0 0 720 230" role="img" aria-labelledby="title desc">
  <title id="title">황산 알루미늄의 전하 균형</title>
  <desc id="desc">알루미늄 이온 두 개의 전하 합은 플러스 6, 황산 이온 세 개의 전하 합은 마이너스 6입니다. 두 전하를 합하면 0이며 화학식은 Al₂(SO₄)₃입니다.</desc>
  <rect width="720" height="230" rx="18" fill="#eff4f9"/>
  <g font-family="system-ui, Malgun Gothic, sans-serif" text-anchor="middle">
    <rect x="18" y="17" width="300" height="104" rx="13" fill="#e3edf9" stroke="#bad0e7"/>
    <rect x="402" y="17" width="300" height="104" rx="13" fill="#dcf0eb" stroke="#add3ca"/>
    <text x="168" y="61" fill="#244e7c" font-size="34" font-weight="800">2 × Al³⁺</text>
    <text x="168" y="98" fill="#244e7c" font-size="24">전하 합 +6</text>
    <text x="360" y="80" fill="#435972" font-size="33" font-weight="700">+</text>
    <text x="552" y="61" fill="#145c50" font-size="34" font-weight="800">3 × SO₄²⁻</text>
    <text x="552" y="98" fill="#145c50" font-size="24">전하 합 −6</text>
    <path d="M168 121v18h384v-18m-192 18v12" fill="none" stroke="#658099" stroke-width="3"/>
    <rect x="18" y="151" width="684" height="62" rx="12" fill="#142b45"/>
    <text x="360" y="191" fill="#fff" font-size="27" font-weight="750">전하 합 0　→　Al₂(SO₄)₃</text>
  </g>
</svg>
