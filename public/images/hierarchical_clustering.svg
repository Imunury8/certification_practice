<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="100%" height="100%">
  <rect width="780" height="380" fill="#ffffff" rx="12" />
  
  <!-- Main Title -->
  <text x="390" y="30" font-family="'Pretendard', -apple-system, sans-serif" font-size="19" font-weight="800" fill="#0f172a" text-anchor="middle">계층적 군집분석 (Hierarchical Clustering) &amp; 덴드로그램 (Dendrogram)</text>

  <!-- Left Box: Dendrogram Structure & Cut Level -->
  <g transform="translate(20, 48)">
    <rect width="360" height="315" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="10" />
    <text x="180" y="24" font-family="'Pretendard', sans-serif" font-size="14" font-weight="800" fill="#1e293b" text-anchor="middle">1. 덴드로그램 구조 &amp; 절단선 (Cut Level)</text>

    <!-- Canvas -->
    <g transform="translate(15, 34)">
      <rect width="330" height="265" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="8" />
      
      <!-- Y-Axis (Distance / Height) -->
      <line x1="40" y1="30" x2="40" y2="225" stroke="#64748b" stroke-width="1.5" />
      <text x="35" y="25" font-family="'Pretendard', sans-serif" font-size="9" font-weight="800" fill="#475569" text-anchor="end">거리 (Height)</text>
      
      <!-- Height Ticks -->
      <line x1="36" y1="60" x2="40" y2="60" stroke="#64748b" stroke-width="1" />
      <text x="32" y="63" font-family="'Pretendard', sans-serif" font-size="8" fill="#64748b" text-anchor="end">h=4</text>
      
      <line x1="36" y1="120" x2="40" y2="120" stroke="#64748b" stroke-width="1" />
      <text x="32" y="123" font-family="'Pretendard', sans-serif" font-size="8" fill="#059669" font-weight="800" text-anchor="end">h=2.5</text>
      
      <line x1="36" y1="180" x2="40" y2="180" stroke="#64748b" stroke-width="1" />
      <text x="32" y="183" font-family="'Pretendard', sans-serif" font-size="8" fill="#64748b" text-anchor="end">h=1</text>

      <!-- Dendrogram Tree Lines -->
      <!-- Leaf A(65), B(115), C(165), D(215), E(265) -->
      
      <!-- Merge A & B at h=1 (y=180) -->
      <line x1="65" y1="225" x2="65" y2="180" stroke="#059669" stroke-width="2" />
      <line x1="115" y1="225" x2="115" y2="180" stroke="#059669" stroke-width="2" />
      <line x1="65" y1="180" x2="115" y2="180" stroke="#059669" stroke-width="2" />
      <!-- AB Root -->
      <line x1="90" y1="180" x2="90" y2="100" stroke="#059669" stroke-width="2" />

      <!-- Merge C & D at h=1.4 (y=160) -->
      <line x1="165" y1="225" x2="165" y2="160" stroke="#0284c7" stroke-width="2" />
      <line x1="215" y1="225" x2="215" y2="160" stroke="#0284c7" stroke-width="2" />
      <line x1="165" y1="160" x2="215" y2="160" stroke="#0284c7" stroke-width="2" />
      <!-- CD Root -->
      <line x1="190" y1="160" x2="190" y2="100" stroke="#0284c7" stroke-width="2" />

      <!-- Merge AB & CD at h=3 (y=100) -->
      <line x1="90" y1="100" x2="190" y2="100" stroke="#0f766e" stroke-width="2" />
      <line x1="140" y1="100" x2="140" y2="60" stroke="#0f766e" stroke-width="2" />

      <!-- Single Leaf E at 265, merges at top h=4 (y=60) -->
      <line x1="265" y1="225" x2="265" y2="60" stroke="#d97706" stroke-width="2" />
      <line x1="140" y1="60" x2="265" y2="60" stroke="#0f172a" stroke-width="2.5" />
      <line x1="202.5" y1="60" x2="202.5" y2="40" stroke="#0f172a" stroke-width="2.5" />

      <!-- Cut Line at h=2.5 (y=120) -->
      <line x1="40" y1="120" x2="305" y2="120" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3" />
      <rect x="220" y="108" width="85" height="18" fill="#fef2f2" stroke="#fca5a5" rx="3" />
      <text x="262" y="121" font-family="'Pretendard', sans-serif" font-size="9" font-weight="800" fill="#dc2626" text-anchor="middle">✂ 절단선 (Cut Level)</text>

      <!-- Leaf Labels -->
      <circle cx="65" cy="225" r="3" fill="#059669" />
      <text x="65" y="240" font-family="'Pretendard', sans-serif" font-size="11" font-weight="800" fill="#065f46" text-anchor="middle">A</text>
      
      <circle cx="115" cy="225" r="3" fill="#059669" />
      <text x="115" y="240" font-family="'Pretendard', sans-serif" font-size="11" font-weight="800" fill="#065f46" text-anchor="middle">B</text>
      
      <circle cx="165" cy="225" r="3" fill="#0284c7" />
      <text x="165" y="240" font-family="'Pretendard', sans-serif" font-size="11" font-weight="800" fill="#0369a1" text-anchor="middle">C</text>
      
      <circle cx="215" cy="225" r="3" fill="#0284c7" />
      <text x="215" y="240" font-family="'Pretendard', sans-serif" font-size="11" font-weight="800" fill="#0369a1" text-anchor="middle">D</text>
      
      <circle cx="265" cy="225" r="3" fill="#d97706" />
      <text x="265" y="240" font-family="'Pretendard', sans-serif" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">E</text>

      <!-- Flow Indicators (Bottom-Up vs Top-Down) -->
      <text x="295" y="190" font-family="'Pretendard', sans-serif" font-size="8" font-weight="800" fill="#059669">▲ 응집형 (Bottom-up)</text>
      <text x="295" y="70" font-family="'Pretendard', sans-serif" font-size="8" font-weight="800" fill="#2563eb">▼ 분할형 (Top-down)</text>
    </g>
  </g>

  <!-- Right Box: Linkage Methods Comparison -->
  <g transform="translate(400, 48)">
    <rect width="360" height="315" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="10" />
    <text x="180" y="24" font-family="'Pretendard', sans-serif" font-size="14" font-weight="800" fill="#1e293b" text-anchor="middle">2. 군집 간 거리 측정 방식 (Linkage Methods)</text>

    <!-- Card 1: Single Linkage -->
    <g transform="translate(12, 34)">
      <rect width="162" height="126" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6" />
      <text x="10" y="18" font-family="'Pretendard', sans-serif" font-size="11" font-weight="800" fill="#2563eb">① 단일 연결법 (Single)</text>
      <text x="10" y="32" font-family="'Pretendard', sans-serif" font-size="9" font-weight="700" fill="#1d4ed8">• 최단 거리 (Nearest)</text>
      <text x="10" y="44" font-family="'Pretendard', sans-serif" font-size="8" fill="#64748b">min( d(x, y) )</text>
      <!-- Visual art: 2 clusters with shortest line -->
      <circle cx="40" cy="75" r="18" fill="#eff6ff" stroke="#bfdbfe" />
      <circle cx="45" cy="72" r="3" fill="#3b82f6" />
      <circle cx="120" cy="75" r="18" fill="#eff6ff" stroke="#bfdbfe" />
      <circle cx="115" cy="72" r="3" fill="#3b82f6" />
      <line x1="45" y1="72" x2="115" y2="72" stroke="#2563eb" stroke-width="2" />
      <text x="80" y="68" font-family="'Pretendard', sans-serif" font-size="8" font-weight="800" fill="#2563eb" text-anchor="middle">최단거리</text>
      <text x="81" y="112" font-family="'Pretendard', sans-serif" font-size="8" fill="#ef4444" text-anchor="middle">※ 사슬 현상 발생 가능</text>
    </g>

    <!-- Card 2: Complete Linkage -->
    <g transform="translate(186, 34)">
      <rect width="162" height="126" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6" />
      <text x="10" y="18" font-family="'Pretendard', sans-serif" font-size="11" font-weight="800" fill="#0284c7">② 완전 연결법 (Complete)</text>
      <text x="10" y="32" font-family="'Pretendard', sans-serif" font-size="9" font-weight="700" fill="#0369a1">• 최장 거리 (Farthest)</text>
      <text x="10" y="44" font-family="'Pretendard', sans-serif" font-size="8" fill="#64748b">max( d(x, y) )</text>
      <!-- Visual art: 2 clusters with longest line -->
      <circle cx="40" cy="75" r="18" fill="#e0f2fe" stroke="#7dd3fc" />
      <circle cx="30" cy="72" r="3" fill="#0284c7" />
      <circle cx="120" cy="75" r="18" fill="#e0f2fe" stroke="#7dd3fc" />
      <circle cx="130" cy="72" r="3" fill="#0284c7" />
      <line x1="30" y1="72" x2="130" y2="72" stroke="#0284c7" stroke-width="2" />
      <text x="80" y="68" font-family="'Pretendard', sans-serif" font-size="8" font-weight="800" fill="#0284c7" text-anchor="middle">최장거리</text>
      <text x="81" y="112" font-family="'Pretendard', sans-serif" font-size="8" fill="#0369a1" text-anchor="middle">※ 구형 군집 형성 경향</text>
    </g>

    <!-- Card 3: Average Linkage -->
    <g transform="translate(12, 172)">
      <rect width="162" height="126" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6" />
      <text x="10" y="18" font-family="'Pretendard', sans-serif" font-size="11" font-weight="800" fill="#4f46e5">③ 평균 연결법 (Average)</text>
      <text x="10" y="32" font-family="'Pretendard', sans-serif" font-size="9" font-weight="700" fill="#4338ca">• 모든 쌍 거리의 평균</text>
      <circle cx="40" cy="75" r="18" fill="#e0e7ff" stroke="#a5b4fc" />
      <circle cx="120" cy="75" r="18" fill="#e0e7ff" stroke="#a5b4fc" />
      <line x1="35" y1="68" x2="115" y2="78" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="2,2" />
      <line x1="45" y1="82" x2="125" y2="68" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="2,2" />
      <text x="80" y="72" font-family="'Pretendard', sans-serif" font-size="8" font-weight="800" fill="#4338ca" text-anchor="middle">Mean(Distance)</text>
      <text x="81" y="112" font-family="'Pretendard', sans-serif" font-size="8" fill="#4f46e5" text-anchor="middle">※ 이상치 영향에 강함</text>
    </g>

    <!-- Card 4: Ward's Method (Highlighted) -->
    <g transform="translate(186, 172)">
      <rect width="162" height="126" fill="#f0fdf4" stroke="#86efac" stroke-width="2" rx="6" />
      <rect x="115" y="6" width="40" height="16" fill="#22c55e" rx="3" />
      <text x="135" y="17" font-family="'Pretendard', sans-serif" font-size="8" font-weight="800" fill="#ffffff" text-anchor="middle">★1순위</text>
      
      <text x="10" y="18" font-family="'Pretendard', sans-serif" font-size="11" font-weight="800" fill="#15803d">④ 와드 연결법 (Ward)</text>
      <text x="10" y="32" font-family="'Pretendard', sans-serif" font-size="9" font-weight="800" fill="#166534">• 오차제곱합(ESS) 최소화</text>
      
      <rect x="10" y="44" width="142" height="42" fill="#ffffff" stroke="#bbf7d0" rx="4" />
      <text x="81" y="60" font-family="'Pretendard', sans-serif" font-size="8" font-weight="800" fill="#15803d" text-anchor="middle">ΔESS = ESS_AB - (ESS_A + ESS_B)</text>
      <text x="81" y="75" font-family="'Pretendard', sans-serif" font-size="8" font-weight="700" fill="#16a34a" text-anchor="middle">증가량이 최소인 군집 결합</text>
      
      <text x="81" y="112" font-family="'Pretendard', sans-serif" font-size="8" font-weight="800" fill="#15803d" text-anchor="middle">※ 군집 내 응집도 극대화</text>
    </g>
  </g>
</svg>
