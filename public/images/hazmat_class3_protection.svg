      <path d="m332 201 20-9 16 10-20 11Z" fill="#deebfa" stroke="#355d91"/>
      <path d="m371 201 14-10 12 11-14 11Z" fill="#deebfa" stroke="#355d91"/>
      <path d="M432 143c-4 8-11 14-11 21a11 11 0 0 0 22 0c0-7-7-13-11-21Z" fill="#c7e2f7" stroke="#355d91"/>
      <path d="m418 147 28 28m0-28-28 28" fill="none" stroke="#aa3d28" stroke-width="3" stroke-linecap="round"/>
      <rect x="548" y="164" width="96" height="63" rx="4" fill="#d8f0eb" stroke="#15776b"/>
