      <path d="M551 214h90v10h-90Z" fill="#f6c398" stroke="none"/>
    </g>
    <text x="596" y="202" font-size="26" font-weight="700" fill="#12574f">N₂</text>
    <g font-size="24" font-weight="700">
      <text x="124" y="266" fill="#23497b">공기 접촉 방지</text>
      <text x="360" y="266" fill="#963b16">물 접촉 금지</text>
      <text x="596" y="266" fill="#12574f">공기·수분 차단</text>
    </g>
    <text x="360" y="330" font-size="24">보호액·불활성가스는 물질별로 선택</text>
