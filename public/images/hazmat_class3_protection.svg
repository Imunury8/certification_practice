<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352" role="img" aria-labelledby="title desc">
  <title id="title">제3류 위험물에 맞는 보호액과 불활성가스</title>
  <desc id="desc">황린은 공기와의 접촉을 피하도록 물속에 저장합니다. 나트륨과 칼륨은 물과 반응하므로 물 접촉을 금지하며 등유 등 적합한 보호액을 사용합니다. 알킬알루미늄은 공기와 수분을 차단하도록 적합한 불활성가스를 봉입합니다. 물방울에 금지 표시가 있는 대상은 나트륨과 칼륨입니다.</desc>
  <rect width="720" height="352" rx="18" fill="#eff4f9"/>
  <g font-family="Malgun Gothic, sans-serif" text-anchor="middle" fill="#142b45">
    <text x="360" y="36" font-size="28" font-weight="700">제3류 · 물질에 맞는 보호 방법</text>
    <rect x="16" y="60" width="216" height="228" rx="14" fill="#fff" stroke="#cad5e1"/>
    <rect x="252" y="60" width="216" height="228" rx="14" fill="#fff" stroke="#cad5e1"/>
    <rect x="488" y="60" width="216" height="228" rx="14" fill="#fff" stroke="#cad5e1"/>
    <g font-size="26" font-weight="700">
      <text x="124" y="96">황린</text>
      <text x="360" y="96">나트륨·칼륨</text>
      <text x="596" y="96">알킬알루미늄</text>
    </g>
    <g font-size="24">
      <text x="124" y="130">물속 저장</text>
      <text x="360" y="130">등유 등 보호액</text>
      <text x="596" y="130">불활성가스 봉입</text>
    </g>
    <g stroke-width="2.5" stroke-linejoin="round">
      <path d="M66 158v69h116v-69" fill="#f8fafc" stroke="#435972"/>
      <path d="M69 178q27-5 55 0t55 0v46H69Z" fill="#c7e2f7"/>
      <path d="m103 204 17-12 23 7-4 15h-32Z" fill="#e5d783" stroke="#a58a38"/>
      <path d="M302 158v69h116v-69" fill="#f8fafc" stroke="#435972"/>
